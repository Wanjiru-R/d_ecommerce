{% extends 'base.html' %}
{% block content %}
<div class="col-md-6 offset-md-3">
<h1>Register</h1>
<br/>
<form method="post" action="">
    {% csrf_token %}
    {% if form.errors %}
        <div class="alert theme-warning" role="alert">
           you have errors in your form. Please correct them and try again.
            {% for field in form %}
            {% if field.errors %}
            {{ field.errors}}
            {% endif %}
            {% endfor %}
            <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    {% endif %}
    {{ form.as_p }}
<br/>
<button type="submit" class="btn-solid theme-secondary">Register</button>
</form>
</div>

{% endblock %}
